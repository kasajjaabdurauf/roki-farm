# =====================================================================
# Nightly backup email — Workaround B ($0 data safety net)
# Free-tier Supabase has no point-in-time restore, so every night this
# workflow queries all farmers + harvest logs, builds a 2-sheet Excel
# workbook and emails it to the admin via Resend (free tier: 100
# emails/day).
#
# Required repository secrets (Settings → Secrets and variables →
# Actions):
#   SUPABASE_URL                  https://xxxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY     the service_role key (bypasses RLS for
#                                 full backup read — keep it secret)
#   RESEND_API_KEY                Resend API key
#   BACKUP_EMAIL_TO               admin inbox (e.g. joan@farm.com)
#   BACKUP_EMAIL_FROM             verified sender (default: onboarding@resend.dev)
# =====================================================================
name: Nightly Database Backup

on:
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC nightly
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are configured
        run: |
          missing=0
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::Missing repository secret: SUPABASE_URL"
            missing=1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::Missing repository secret: SUPABASE_SERVICE_ROLE_KEY"
            missing=1
          fi
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "::error::Missing repository secret: RESEND_API_KEY"
            missing=1
          fi
          if [ -z "${{ secrets.BACKUP_EMAIL_TO }}" ]; then
            echo "::error::Missing repository secret: BACKUP_EMAIL_TO"
            missing=1
          fi
          if [ -z "${{ secrets.BACKUP_EMAIL_FROM }}" ]; then
            echo "::warning::BACKUP_EMAIL_FROM not set — will default to onboarding@resend.dev"
          fi
          if [ "$missing" = "1" ]; then
            echo "Add the missing secrets in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "Secrets OK"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run daily backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_EMAIL_TO: ${{ secrets.BACKUP_EMAIL_TO }}
          BACKUP_EMAIL_FROM: ${{ secrets.BACKUP_EMAIL_FROM }}
        run: node scripts/daily-backup.js
