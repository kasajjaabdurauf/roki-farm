# =====================================================================
# Keep Supabase Awake — Workaround A ($0 hosting reliability)
# Supabase pauses free-tier projects after ~7 days with no API calls
# (e.g. off-harvest season). This workflow pings the REST API every
# 3 days so the database never pauses.
#
# Required repository secrets:
#   SUPABASE_URL       e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  the anon (publishable) key
# =====================================================================
name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 0 */3 * *" # every 3 days at midnight UTC
  workflow_dispatch: {}   # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (farmers)
        run: |
          curl -sS -o /dev/null -w "farmers ping -> HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/farmers?select=count"

      - name: Ping Supabase REST API (produce_logs)
        run: |
          curl -sS -o /dev/null -w "logs ping -> HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/produce_logs?select=count"
